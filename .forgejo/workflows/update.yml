name: Update
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: host-nixos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "Update Bot"
          git config user.email "maxschipper@users.noreply.codeberg.org"

      - name: Update Script
        run: ./update.sh

      - name: Push
        run: git push origin HEAD:main
